name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin zip
        id: build
        run: echo "zip=$(./build.sh)" >> "$GITHUB_OUTPUT"
      - name: Check tag matches plugin version
        run: |
          case "${{ steps.build.outputs.zip }}" in
            *"-${GITHUB_REF_NAME#v}.zip") ;;
            *) echo "Tag $GITHUB_REF_NAME does not match version in __init__.py"; exit 1 ;;
          esac
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" "${{ steps.build.outputs.zip }}" --title "Restart Servers $GITHUB_REF_NAME" --notes "$notes"
